version: 0.2

phases:
  install:
    runtime-versions:
      dotnet: 8.0

  pre_build:
    commands:
      - echo "Restoring dependencies..."
      - dotnet restore

  build:
    commands:
      - echo "Building .NET Core app..."
      - dotnet build --configuration Release
      - dotnet publish -c Release -o ./publish --no-self-contained

  post_build:
    commands:
      
      - echo "Listing publish directory contents"
      - ls -la ./publish
      - echo "Looking for runtimeconfig.json"
      - find ./publish -name "*.runtimeconfig.json"

      - cd publish
      - zip -r ../app.zip *
      - cd ..
      - echo "Verifying zip contents"
      - unzip -l app.zip | grep runtimeconfig.json

artifacts:
  files:
    - app.zip
  discard-paths: no