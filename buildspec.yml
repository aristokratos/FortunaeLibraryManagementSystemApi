version: 0.2

phases:
  install:
    runtime-versions:
      dotnet: 8.0

  build:
    commands:
      - echo "Building .NET Web API"
      - dotnet restore
      - dotnet build --configuration Release
      - dotnet publish -c Release -o ./publish --self-contained false

  post_build:
    commands:
      - echo "Verifying build output"
      - ls -l ./publish
      - ls -l ./publish/*.runtimeconfig.json
      - echo "Zipping deployment package"
      - cd publish && zip -r ../app.zip ./*
      - cd ..
      - echo "Uploading artifact to AWS S3"

artifacts:
  files:
    - app.zip
  discard-paths: no